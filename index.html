<style>
@font-face{font-family:"Poppins";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/poppins-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/poppins-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/poppins-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/poppins-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/poppins-latin-800-normal.woff2) format("woff2")}

/* Layout: one phone column: header (Home, Saved Workouts dropdown, Settings), then Home, Settings or a workout screen; all edits in bottom sheets. Single dark look by design, matching the program cards. */
:root{
  --bg:#0d1015; --card:#1b1e26; --chip:#2a2e38; --chip-hi:#343946;
  --fg:#f4f5f7; --muted:#8b909c; --accent:#ff7a2b; --accent-ink:#1a0d04; --danger:#ff5a5a;
  --ok:#49d17d; --ok-bg:#16301f; --cardio:#4fb3ff; --sauna:#ff5f7e; --misc:#b69cff;
  --display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--display);-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
/* Every screen stacks its pieces with a small gap, so cards, buttons, tiles and panels never touch. */
#main{display:flex;flex-direction:column;gap:12px}
.btns > div:empty,#main > div:empty{display:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}


.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.head h1{margin:0;font-size:clamp(30px,9vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em;text-wrap:balance;text-align:left}
.head h1 span{color:var(--accent)}
.head h1 button{all:unset;cursor:pointer}
.total{color:var(--muted);font-size:17px;white-space:nowrap;padding-bottom:6px;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px;margin:-9px 0 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sync{font-size:12px}
.section-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:6px 0 -4px}

/* session bar */
.offline{background:#2b2210;border:1px solid #5a4416;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;color:#e9d9b8}
.offline b{display:block;color:var(--accent);font-size:14px;margin-bottom:2px}
.session{background:var(--card);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;font-size:14px}
.session .bar{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.session .bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .2s}
.session b{font-variant-numeric:tabular-nums;white-space:nowrap}

.list{display:flex;flex-direction:column;gap:12px}
/* Drag handle sits above the exercise number in one narrow left column, leaving the rest of the card for the name and sets. */
.card{background:var(--card);border-radius:18px;padding:12px 14px 14px 8px;display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto 1fr;column-gap:10px;border:1.5px solid transparent;transition:border-color .15s;position:relative}
.handle{grid-column:1;grid-row:1;width:34px;height:30px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;border-radius:8px}
.card > .num{grid-column:1;grid-row:2;align-self:start;margin-top:2px}
.card > .body{grid-column:2;grid-row:1 / span 2}
.handle svg{width:18px;height:18px}
.handle:active{cursor:grabbing;color:var(--accent)}
.card.dragging{z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.55);border-color:var(--accent);transition:none}
.card.shifting{transition:transform .15s ease}
body.drag-lock{user-select:none;-webkit-user-select:none}
.card.done{border-color:#24563a}
.num{width:34px;height:34px;border-radius:50%;background:var(--chip);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:2px}
.card.done .num{background:var(--ok-bg);color:var(--ok)}
.body{min-width:0;display:flex;flex-direction:column;gap:10px}
.trow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.title{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0;flex:1}
.title b{color:var(--accent);font-size:20px;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.title small{color:var(--muted);font-weight:600;font-size:12px}
.complete{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--chip-hi);color:var(--muted);font-size:13px;font-weight:700}
.complete svg{width:14px;height:14px}
.complete[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#06210f}
.sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{background:var(--chip);border-radius:10px;padding:8px 6px;display:flex;align-items:baseline;justify-content:center;gap:6px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.chip:active{background:var(--chip-hi)}
.chip i{font-style:normal;font-weight:500;font-size:11px;color:var(--muted)}
.chip.empty{color:var(--muted);font-weight:500}

.addex{border:1.5px dashed var(--chip-hi);border-radius:18px;padding:16px;color:var(--accent);font-weight:600;text-align:center}
.foot{color:var(--muted);text-align:center;font-size:13px;margin:0}
.empty-state{background:var(--card);border-radius:18px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
.empty-state strong{color:var(--fg);font-size:18px}

/* dashboard */
.btn-sm{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.tile .ic svg{width:20px;height:20px}
.tile b{font-size:17px}
.tile small{color:var(--muted);font-size:12px;margin-top:-8px}
.t-workout .ic{background:#33200f;color:var(--accent)}
.t-cardio .ic{background:#0f2433;color:var(--cardio)}
.t-sauna .ic{background:#33121a;color:var(--sauna)}
.t-misc .ic{background:#231c3a;color:var(--misc)}
.week{background:var(--card);border-radius:18px;padding:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;gap:2px}
.week b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.week small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.feed{display:flex;flex-direction:column;background:var(--card);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;border-top:1px solid var(--chip)}
.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.dot.workout{background:var(--accent)}.dot.cardio{background:var(--cardio)}.dot.sauna{background:var(--sauna)}.dot.misc{background:var(--misc)}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .txt span{font-size:13px;color:var(--muted)}
.item time{font-size:12px;color:var(--muted);white-space:nowrap}
.feed .emptyfeed{padding:18px;color:var(--muted);font-size:14px;text-align:center}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;max-height:88%;overflow:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .22s ease}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.card,.session .bar i{transition:none}}
.sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--chip-hi);margin:0 auto 4px}
.sheet h2{margin:0;font-size:20px;font-weight:700}
.sheet h2 em{font-style:normal;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.field input:not([type=checkbox]),.field select,.field textarea{background:var(--chip);border:1px solid transparent;border-radius:12px;padding:12px;font-size:17px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:64px}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--chip);font-size:22px;font-weight:600}
.stepper output{min-width:40px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.preview{background:var(--chip);border-radius:12px;padding:12px;text-align:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{border-radius:14px;padding:14px;font-weight:700;font-size:16px;background:var(--chip)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #4a2a2e}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.4}
.inline{display:flex;gap:10px}
.inline .btn{flex:1}
.confirm{background:#2a1a1d;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.err{color:var(--danger);font-size:14px;min-height:1em}
.daypick{display:flex;flex-direction:column;gap:8px}
.daypick button{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--chip);border-radius:14px;padding:14px;text-align:left}
.daypick b{font-size:16px}.daypick b span{color:var(--accent)}
.daypick small{color:var(--muted);font-size:13px;white-space:nowrap}
.daypick .tag{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.detail{display:flex;flex-direction:column;gap:8px;font-size:14px}
.detail .ex{background:var(--chip);border-radius:12px;padding:10px 12px}
.detail .ex b{display:block;color:var(--accent);font-size:15px}
.detail .ex span{color:var(--muted);font-variant-numeric:tabular-nums}

/* exercise picker */
.exlist{background:var(--chip);border-radius:12px;max-height:290px;overflow:auto;margin-top:-6px}
.exlist .grp{position:sticky;top:0;background:#20242d;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:7px 12px}
.exlist .opt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:11px 12px;text-align:left;font-size:15px;border-top:1px solid #30353f}
.exlist .grp + .opt{border-top:0}
.exlist .opt small{color:var(--muted);font-size:12px;white-space:nowrap}
.exlist .opt .star{color:var(--accent);font-size:12px}
.exlist .opt.new{color:var(--accent);font-weight:700;border-top:0}
.exlist .none{padding:14px 12px;color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted);background:var(--chip);border-radius:12px;padding:10px 12px}
.hint.prompt{color:#e9d9b8;background:#2b2210}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.parts .check{background:var(--chip);border-radius:10px;padding:9px 10px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--fg)}
.setrows{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr;gap:8px;align-items:center}
.setrow i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.setrow select{background:var(--chip);border:1px solid transparent;border-radius:10px;padding:10px;font-size:16px;width:100%;min-width:0}
.setrow select.missing{border-color:#6a4a1a}
.adhoc-pick{display:flex;flex-direction:column;gap:8px}
.adhoc-pick button{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--chip-hi);border-radius:14px;padding:12px 14px;text-align:left}
.adhoc-pick button.resume{border-style:solid;border-color:var(--accent)}
.adhoc-pick .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#33200f;color:var(--accent);flex:0 0 auto}
.adhoc-pick .ic svg{width:18px;height:18px}
.adhoc-pick b{display:block;font-size:16px}
.adhoc-pick small{color:var(--muted);font-size:13px}
.or{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;text-align:center}

/* calendar */
.cal{background:var(--card);border-radius:18px;padding:12px 10px 14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-head b{font-size:16px}
.cal-head button{width:36px;height:36px;border-radius:10px;background:var(--chip);font-size:18px;font-weight:700;color:var(--fg)}
.cal-head button:disabled{opacity:.3}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-grid .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal-day{aspect-ratio:1/1.12;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding-top:5px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.cal-day.has{background:var(--chip);color:var(--fg);font-weight:600}
.cal-day.today{outline:1.5px solid var(--accent);outline-offset:-1.5px;color:var(--fg)}
.cal-day .mi{width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
.cal-day .mi svg{width:14px;height:14px}
.cal-day .mi.workout{background:#33200f;color:var(--accent)}.cal-day .mi.cardio{background:#0f2433;color:var(--cardio)}
.cal-day .mi.sauna{background:#33121a;color:var(--sauna)}.cal-day .mi.misc{background:#231c3a;color:var(--misc)}
.cal-day .dots{display:flex;gap:2px;height:4px}
.cal-day .dots i{width:4px;height:4px;border-radius:50%}
.cal-day .dots .workout{background:var(--accent)}.cal-day .dots .cardio{background:var(--cardio)}.cal-day .dots .sauna{background:var(--sauna)}.cal-day .dots .misc{background:var(--misc)}
.cal-day:not(.has){cursor:default}
.daylog{display:flex;flex-direction:column;gap:10px}
.daylog .entry{background:var(--chip);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left}
.daylog .entry .top{display:flex;align-items:center;gap:10px}
.daylog .entry .top b{flex:1;font-size:16px}
.daylog .entry .top small{color:var(--muted);font-size:12px}
.daylog .entry .sub2{color:var(--muted);font-size:13px}
.daylog .ex{font-size:13px;line-height:1.45}
.daylog .ex b{color:var(--accent);font-weight:600}
.daylog .ex span{color:var(--muted);font-variant-numeric:tabular-nums}

/* header: Home · Saved Workouts dropdown · Settings */
.topbar{display:flex;gap:8px;align-items:center;position:relative;padding:4px 0 6px;width:100%}
.tb{min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap}
.tb[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.dd{flex:1;min-width:0}
.tb.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tb.dd-btn span{overflow:hidden;text-overflow:ellipsis}
.tb.dd-btn svg{flex:0 0 auto;transition:transform .15s}
.tb.dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.tb.icon{width:44px;padding:0;display:grid;place-items:center;flex:0 0 auto}
.tb.icon svg{width:20px;height:20px}
.dd-menu{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:15;background:var(--card);border:1px solid var(--chip-hi);border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.6);max-height:min(460px,65vh);overflow:auto;-webkit-overflow-scrolling:touch;padding:6px}
.dd-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:8px 12px 4px}
.dd-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:8px 12px;border-radius:12px;text-align:left}
.dd-item span:first-child{min-width:0}
.dd-item b{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-item small{color:var(--muted);font-size:12px}
.dd-item.cur{background:var(--chip)}
.dd-item.new{color:var(--accent);font-weight:700;font-size:16px;min-height:48px}
.heart{color:var(--sauna);font-size:18px;line-height:1;flex:0 0 auto}
.daypick .heart{font-size:15px;margin-left:4px}
.dd-sep{height:1px;background:var(--chip);margin:4px 8px}
.dd-empty{padding:12px;color:var(--muted);font-size:14px}
.pickdd{display:flex;flex-direction:column;gap:6px}
.pickdd .tb.dd-btn{background:var(--chip);color:var(--fg)}
.pick-menu{background:var(--chip);border-radius:14px;padding:6px;max-height:min(360px,50vh);overflow:auto;-webkit-overflow-scrolling:touch}
.pick-menu .dd-item.cur,.pick-menu .dd-item:active{background:var(--chip-hi)}
.pick-menu .tag{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.tb.dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}

/* saved workout detail */
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{min-height:40px;border-radius:12px;background:var(--card);font-weight:600;font-size:14px;color:var(--fg);padding:4px;display:grid;place-items:center}
.act.fav svg{width:22px;height:22px;color:var(--muted)}
.act.fav.on svg{color:#ff3b4a}
.act.danger{color:var(--danger)}
.act.ico svg{width:21px;height:21px}
.btn.start{padding:16px;font-size:17px}
.btn.kept{background:var(--ok-bg);color:var(--ok)}

/* settings */
.panel{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel.inset{background:var(--chip)}
.pnote{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.pnote b{color:var(--fg)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.kv span{color:var(--muted)}
.removed{display:flex;align-items:center;justify-content:space-between;gap:12px}
.removed b{display:block;font-size:15px}
.removed small{color:var(--muted);font-size:12px}
.filebtn{position:relative;text-align:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.mono{font-family:ui-monospace,Menlo,monospace}

/* iPhone install tip */
.tip{display:flex;gap:10px;align-items:flex-start;background:#132433;border:1px solid #1f4058;border-radius:14px;padding:12px 12px 12px 14px;font-size:14px;line-height:1.45;color:#cfe3f2}
.tip b{display:block;color:var(--fg);margin-bottom:2px}
.tip b.inl{display:inline}
.tip .share-ic{display:inline-block;vertical-align:-2px;color:var(--cardio)}
.tip-x{flex:0 0 auto;width:44px;height:44px;margin:-10px -8px -10px 0;color:var(--muted);font-size:16px}

/* toast and update banner, clear of the notch and home indicator */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:40;background:#f4f5f7;color:#0d1015;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .2s,transform .2s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.updbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));z-index:45;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:6px 6px 6px 14px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:560px;margin:0 auto}
.updbar span{flex:1}
.updbar button{min-height:40px;border-radius:10px;font-weight:700;padding:0 12px}
#upd-go{background:var(--accent-ink);color:var(--accent)}
#upd-x{width:40px;padding:0}

/* iPhone: 16px+ text in every field so tapping doesn't zoom; 44px tap targets; visible press feedback */
input,select,textarea{font-size:16px}
.field input:not([type=checkbox]),.field select,.field textarea{font-size:17px}
textarea.mono{font-size:16px}
.complete{min-height:44px;padding:8px 14px}
.chip{min-height:40px;align-items:center}
.handle{height:40px}
.cal-head button{width:44px;height:44px}
.btn-sm{min-height:40px}
button:not(:disabled):active,.filebtn:active{opacity:.75}
.btn:not(:disabled):active,.tile:active,.act:active,.dd-item:active,.item:active,.cal-day.has:active{transform:scale(.98)}
.btn,.tile,.act,.dd-item,.item,.cal-day{transition:transform .08s,opacity .08s}
.sheet{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
</style>
</head>
<body>

<div class="wrap" id="app">
  <nav class="topbar" id="tabs" aria-label="Sections"></nav>
  <div id="main"></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="updbar" id="updbar" role="status" hidden><span>A new version of Workout Split is ready.</span><button id="upd-go">Update now</button><button id="upd-x" aria-label="Later">✕</button></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="inner" id="sheetInner"></div></div>

<script>
(() => {
  const MAX_SETS = 10, MAX_SAVED = 200;
  /* ---------- storage slots (see CLAUDE.md: never lose user data) ----------
     Data version 1 (no meta slot): header "Day" workouts in LOCAL_KEY.
     Data version 2: Saved Workouts in LOCAL_SAVED. LOCAL_KEY is kept untouched so older app copies still work. */
  const DATA_VERSION = 2;
  const LOCAL_KEY = "workout-split-v1", LOCAL_LOGS = "workout-split-logs-v1", LOCAL_ADHOC = "workout-split-adhoc-v1";
  const LOCAL_EXERCISES = "workout-split-exercises-v1";
  const LOCAL_META = "workout-split-meta", LOCAL_SAVED = "workout-split-saved-v2", LOCAL_FAVS = "workout-split-favorites-v1";
  const LOCAL_REMOVED = "workout-split-removed-v1", LOCAL_KEEP = "workout-split-adhoc-keep-v1", LOCAL_SETTINGS = "workout-split-settings-v1";
  const LOCAL_PRE_V2 = "workout-split-backup-before-v2", LOCAL_PRE_RESTORE = "workout-split-backup-before-restore";
  const ALL_DATA_KEYS = [LOCAL_KEY, LOCAL_LOGS, LOCAL_ADHOC, LOCAL_EXERCISES, LOCAL_META, LOCAL_SAVED, LOCAL_FAVS, LOCAL_REMOVED, LOCAL_KEEP, LOCAL_SETTINGS];
  const ICONS = {
    workout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>',
    cardio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>',
    sauna:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 4c-1.5 2 1.5 3 0 5M12 4c-1.5 2 1.5 3 0 5M16 4c-1.5 2 1.5 3 0 5M4 14h16M6 14v6M18 14v6M4 20h16"/></svg>',
    misc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
  };
  const CARDIO_TYPES = ["Run","Walk","Incline walk","Bike","Row","Elliptical","Stair climber","Swim","Hike","Other"];

  let state = { days: [] }; // state.days = Saved Workouts [{id, name, exercises}] (named "days" from version 1)
  let logs = [];            // History: [{id, type, date, ts, ...}]
  let favs = [];            // ids of Favorite saved workouts
  let removed = [];         // Recently removed saved workouts [{workout, removedAt, wasFavorite}]; restorable
  let settings = {};        // {name, lastExport, tipDismissed}
  let keepId = null;        // id of the ad hoc draft marked "Keep active"
  let view = "home";        // "home" | "settings" | "detail" | "adhoc" | saved workout index (number) = workout in progress
  let detailIdx = null;     // saved workout shown when view === "detail"
  let adhoc = null;         // in-progress ad hoc workout {id, name, date, exercises}; never added to Saved Workouts automatically
  let calMonth = null;      // "YYYY-MM" shown in the calendar; null = this month
  let ddOpen = false;       // Saved Workouts dropdown open
  let mode = "loading", syncMsg = "Loading…";

  const uid = () => Math.random().toString(36).slice(2, 10);
  const curDay = () => view === "adhoc" ? adhoc : view === "detail" ? state.days[detailIdx] : typeof view === "number" ? state.days[view] : undefined;
  const isFav = w => !!w && favs.includes(w.id);
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  /* ---------- dates ---------- */
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const fmtDate = s => parseDate(s).toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  function ago(s) {
    const n = Math.round((parseDate(todayStr()) - parseDate(s)) / 864e5);
    return n <= 0 ? "Today" : n === 1 ? "Yesterday" : `${n} days ago`;
  }
  function weekStart() { const d = parseDate(todayStr()); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return d; }

  /* ---------- formatting ---------- */
  const fmtW = w => w === "BW" ? "BW" : String(w);
  function fmtSet(s) {
    const hasR = s.r != null && s.r !== "", hasW = s.w != null && s.w !== "";
    const pair = s.pair ? " ×2" : "";
    if (hasR && hasW) return `${s.r}@${fmtW(s.w)}${pair}`;
    if (hasR) return `${s.r} reps`;
    if (hasW) return s.w === "BW" ? "BW" : `${fmtW(s.w)} lb${pair}`;
    return "Tap to set";
  }
  const totalSets = d => d.exercises.reduce((n, e) => n + e.sets.length, 0);
  const fmtMin = m => m >= 60 ? `${Math.floor(m/60)} hr${m%60 ? " " + (m%60) + " min" : ""}` : `${m} min`;
  const adhocLabel = l => l.dayName && l.dayName !== "Ad Hoc" ? `${l.dayName} · Ad Hoc` : "Ad Hoc workout";
  // Workout name as recorded in the log. Version 1 logs carry a Day number; newer ones store the saved workout's name.
  const workoutName = l => l.adhoc ? l.dayName : l.dayNum ? `${l.dayName} · Day ${l.dayNum}` : (l.dayName || "Workout");
  function logTitle(l) {
    if (l.type === "workout") return l.adhoc ? adhocLabel(l) : workoutName(l);
    if (l.type === "cardio") return l.activity || "Cardio";
    if (l.type === "sauna") return "Sauna";
    return l.what || "Misc";
  }
  function logDetail(l) {
    if (l.type === "workout") return `${l.done.length}/${l.total} exercises · ${l.done.reduce((n,e)=>n+e.sets.length,0)} sets`;
    const parts = [];
    if (l.minutes) parts.push(fmtMin(l.minutes));
    if (l.distance) parts.push(`${l.distance} ${l.unit || "mi"}`);
    if (l.type === "sauna" && l.temp) parts.push(`${l.temp}°F`);
    if (l.note) parts.push(l.note);
    return parts.join(" · ") || (l.type === "cardio" ? "Cardio" : l.type === "sauna" ? "Sauna" : "Misc");
  }
  const sortedLogs = () => logs.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  // Ad hoc sessions don't move the rotation, so they're skipped here.
  const lastWorkout = () => sortedLogs().find(l => l.type === "workout" && !l.adhoc);
  // Rotation cycles through Favorites in their saved order.
  const favWorkouts = () => state.days.filter(isFav);
  function nextInRotation() {
    const list = favWorkouts(); if (!list.length) return null;
    const last = lastWorkout(), i = last ? list.findIndex(w => w.id === last.dayId) : -1;
    return list[(i + 1) % list.length];
  }
  // Dropdown order: Favorites first (in saved order), then everything else A–Z.
  function savedOrder() {
    const rest = state.days.filter(w => !isFav(w)).sort((a, b) => a.name.localeCompare(b.name));
    return [...favWorkouts(), ...rest];
  }
  const nameTaken = (name, exceptId) => state.days.some(w => w.id !== exceptId && w.name.trim().toLowerCase() === name.trim().toLowerCase());
  function uniqueName(base, taken = n => nameTaken(n)) { base = base.trim().slice(0, 40) || "Workout"; let n = base, i = 2; while (taken(n)) n = `${base} (${i++})`; return n; }

  /* ---------- exercise library ---------- */
  // Starting list, grouped by body part. A trailing "*" marks the ★ exercises from the original list.
  const CATALOG = {
    "Chest": ["Barbell Bench Press","Incline Barbell Bench Press","Decline Barbell Bench Press","Flat DB Bench Press*","Incline DB Bench Press*","Decline DB Bench Press","Smith Machine Bench Press","Smith Machine Incline Press","Machine Chest Press","Incline Machine Press","DB Fly","Incline DB Fly","Cable Fly","Low-to-High Cable Fly","Pec Deck","Push-Up","Weighted Dip*","Bodyweight Dip*"],
    "Back": ["Conventional Deadlift","Trap Bar Deadlift*","Machine Deadlift*","Rack Pull","Pull-Up","Chin-Up","Weighted Pull-Up","Assisted Pull-Up Machine","Lat Pulldown*","Wide-Grip Lat Pulldown*","Close-Grip (V-Bar) Pulldown","Single-Arm Cable Pulldown","Straight-Arm Cable Pulldown","Barbell Bent-Over Row","Pendlay Row","One-Arm DB Row","T-Bar Row*","Chest-Supported Row*","Seated Cable Row","Iso-Lateral Machine Row","Meadows Row","Seal Row","Inverted Row","DB Pullover","45° Back Extension"],
    "Shoulders & Traps": ["Barbell Overhead Press","Seated DB Shoulder Press*","Standing DB Shoulder Press","Arnold Press*","Machine Shoulder Press","Smith Machine Shoulder Press","Landmine Press","Push Press","DB Lateral Raise*","Cable Lateral Raise*","Machine Lateral Raise","DB Front Raise","Plate Front Raise","Rear Delt Fly Machine*","Bent-Over DB Rear Delt Fly","Cable Rear Delt Fly","Cable Face Pull*","Upright Row","Barbell Shrug","DB Shrug","Machine Shrug*","Incline Y-Raise"],
    "Biceps": ["Barbell Curl","EZ-Bar Curl","DB Curl","Incline DB Curl","Hammer Curl","Cable Biceps Curl*","Bayesian Cable Curl*","EZ-Bar Preacher Curl","Preacher Curl Machine*","Spider Curl","Concentration Curl","Reverse Curl","Drag Curl"],
    "Triceps": ["Close-Grip Bench Press","EZ-Bar Skull Crusher","Rope Triceps Pushdown","Straight-Bar Pushdown","Overhead Triceps Extension*","Overhead Cable Triceps Extension","DB Kickback","JM Press","Bench Dip","Machine Triceps Extension","Diamond Push-Up"],
    "Forearms & Grip": ["Farmer Carry*","Wrist Curl","Reverse Wrist Curl","Dead Hang","Suitcase Carry"],
    "Quads": ["Back Squat","Front Squat","Smith Machine Squat*","Belt Squat*","Hack Squat","Pendulum Squat","Goblet Squat","Safety Bar Squat","Leg Press*","Leg Extension*","Bulgarian Split Squat*","Walking Lunge","Reverse Lunge","Step-Up","Sissy Squat","Split Squat"],
    "Hamstrings & Glutes": ["Barbell Romanian Deadlift","DB Romanian Deadlift","Stiff-Leg Deadlift","Single-Leg RDL","Good Morning","Seated Leg Curl*","Lying Leg Curl*","Nordic Hamstring Curl","GHD Glute-Ham Raise*","Barbell Hip Thrust","Hip Thrust Machine*","Glute Bridge","Cable Pull-Through","Kettlebell Swing","Sumo Deadlift","Hip Abduction Machine","Hip Adduction Machine","Cable Glute Kickback","Reverse Hyperextension"],
    "Calves": ["Standing Calf Raise","Seated Calf Raise","Leg Press Calf Raise","Single-Leg DB Calf Raise"],
    "Core": ["Cable Crunch*","Hanging Knee Raise*","Hanging Leg Raise","Ab Wheel Rollout","Weighted Plank","Side Plank","Pallof Press","Cable Woodchop","Decline Sit-Up","Dead Bug","Machine Ab Crunch"],
    "Full Body / Power": ["Power Clean","Hang Clean","Thruster","DB Snatch","Turkish Get-Up","Sled Push"]
  };
  const BODY_PARTS = Object.keys(CATALOG), OTHER = "Other";
  let customEx = [];        // [{name, parts}] exercises this user typed in; saved on this phone

  // Matching key so "Farmer Carries", "farmer carry" and "Flat Dumbbell Bench Press" / "Flat DB Bench Press" line up.
  const exKey = s => String(s ?? "").toLowerCase().replace(/dumbbell/g, "db").replace(/[^a-z0-9]+/g, " ").trim().split(" ")
    .map(w => w === "laying" ? "lying" : w.length > 3 && /ies$/.test(w) ? w.slice(0, -3) + "y" : w.length > 3 && /(ch|sh|x|ss)es$/.test(w) ? w.slice(0, -2) : w.length > 3 && /[^s]s$/.test(w) ? w.slice(0, -1) : w).join(" ");

  function persistCustom() { try { localStorage.setItem(LOCAL_EXERCISES, JSON.stringify(customEx)); } catch {} }
  function cleanCustom(list) {
    return (Array.isArray(list) ? list : []).filter(e => e && e.name).map(e => ({
      name: String(e.name).slice(0, 60), parts: (Array.isArray(e.parts) ? e.parts : []).filter(p => BODY_PARTS.includes(p))
    }));
  }
  // Everything the dropdown offers: the starting list, the user's own exercises, and any names already in
  // their program or logs (so older data still matches up). One entry per exercise.
  function library() {
    const map = new Map();
    BODY_PARTS.forEach(part => CATALOG[part].forEach(raw => {
      const name = raw.replace(/\*$/, "");
      map.set(exKey(name), { name, parts: [part], star: raw.endsWith("*") });
    }));
    customEx.forEach(e => { const k = exKey(e.name); if (!map.has(k)) map.set(k, { name: e.name, parts: e.parts.length ? e.parts : [OTHER], custom: true }); });
    const seen = [];
    state.days.forEach(d => d.exercises.forEach(e => seen.push(e.name)));
    if (adhoc) adhoc.exercises.forEach(e => seen.push(e.name));
    logs.forEach(l => (l.done || []).forEach(e => seen.push(e.name)));
    seen.forEach(n => { const k = exKey(n); if (n && k && !map.has(k)) map.set(k, { name: n, parts: [OTHER], custom: true }); });
    return [...map.values()];
  }
  // The sets from the most recent logged workout that included this exercise; falls back to the program.
  function lastSetsFor(name) {
    const k = exKey(name);
    for (const l of sortedLogs()) {
      if (l.type !== "workout") continue;
      const e = (l.done || []).find(d => exKey(d.name) === k);
      if (e && e.sets?.length) return { sets: e.sets, date: l.date, from: "log" };
    }
    for (const d of state.days) {
      const e = d.exercises.find(x => exKey(x.name) === k && x.sets.length);
      if (e) return { sets: e.sets, from: "program", dayName: d.name };
    }
    return null;
  }

  /* ---------- storage: read, write, migrate ---------- */
  function readJSON(key) { try { const raw = localStorage.getItem(key); return raw == null ? null : JSON.parse(raw); } catch { return undefined; } }
  let storageWarned = false;
  function writeRaw(key, text) {
    try { localStorage.setItem(key, text); return true; }
    catch { if (!storageWarned) { storageWarned = true; toast("Couldn't save: phone storage is full. Export your data in Settings."); } return false; }
  }
  const writeJSON = (key, val) => writeRaw(key, JSON.stringify(val));

  const cleanSet = s => ({ r: s?.r ?? null, w: s?.w ?? null, pair: !!s?.pair });
  function normalizeWorkout(w) {
    return {
      id: String(w?.id || uid()), name: String(w?.name ?? "Workout").slice(0, 60),
      exercises: (Array.isArray(w?.exercises) ? w.exercises : []).map(e => ({
        id: String(e?.id || uid()), name: String(e?.name ?? "Exercise").slice(0, 60),
        sets: (Array.isArray(e?.sets) ? e.sets : []).slice(0, MAX_SETS).map(cleanSet)
      })),
      ...(w?.savedAt ? { savedAt: w.savedAt } : {})
    };
  }
  const normalizeWorkouts = list => (Array.isArray(list) ? list : []).slice(0, MAX_SAVED).map(normalizeWorkout);

  // Version 1 → 2: each header "Day" becomes a Saved Workout with the same id (so History still links to it),
  // named "<name> · Day N" so the three "Full Body" days stay distinguishable.
  function v1DaysToSaved(days) {
    const out = [];
    (Array.isArray(days) ? days : []).forEach((d, i) => {
      const w = normalizeWorkout(d);
      w.name = uniqueName(`${w.name} · Day ${i + 1}`, n => out.some(x => x.name.toLowerCase() === n.toLowerCase()));
      out.push(w);
    });
    return out;
  }
  // Add incoming workouts whose ids aren't already present (or removed). Never replaces anything.
  function addMissing(existing, incoming) {
    const have = new Set([...existing.map(w => w.id), ...removed.map(r => r.workout?.id)]);
    return [...existing, ...incoming.filter(w => !have.has(w.id))];
  }

  // Runs once per data version. Snapshots the original data first, writes the upgraded copy,
  // and only then records the new version. Safe to run again if interrupted.
  function migrate() {
    const meta = readJSON(LOCAL_META);
    const version = meta?.dataVersion || 1;
    if (version >= DATA_VERSION) return true;
    if (localStorage.getItem(LOCAL_PRE_V2) == null) {
      const items = {};
      [LOCAL_KEY, LOCAL_LOGS, LOCAL_ADHOC, LOCAL_EXERCISES].forEach(k => { const v = localStorage.getItem(k); if (v != null) items[k] = v; });
      if (!writeJSON(LOCAL_PRE_V2, { takenAt: new Date().toISOString(), fromVersion: version, items })) return false;
    }
    const v1 = readJSON(LOCAL_KEY);
    const fromV1 = v1DaysToSaved(v1?.days);
    const saved = readJSON(LOCAL_SAVED);
    const workouts = addMissing(normalizeWorkouts(saved?.workouts), fromV1);
    const favsNow = Array.isArray(readJSON(LOCAL_FAVS)) ? readJSON(LOCAL_FAVS) : [];
    const favsNext = [...new Set([...favsNow, ...fromV1.map(w => w.id)])];   // migrated workouts start as Favorites
    if (!writeJSON(LOCAL_SAVED, { dataVersion: DATA_VERSION, workouts, updatedAt: Date.now() })) return false;
    if (!writeJSON(LOCAL_FAVS, favsNext)) return false;
    return writeJSON(LOCAL_META, { dataVersion: DATA_VERSION, migratedAt: new Date().toISOString(), fromVersion: version, v1SeenAt: v1?.updatedAt || 0 });
  }

  /* ---------- saving: every change is written immediately ---------- */
  // Writes the saved workouts and the ad hoc draft. It never clears the draft slot: only Finish, Delete
  // and the daily expiry do that (persistAdhoc), so a stale copy of the page can't wipe a draft.
  function save() {
    writeJSON(LOCAL_SAVED, { dataVersion: DATA_VERSION, workouts: state.days, updatedAt: Date.now() });
    if (adhoc) writeJSON(LOCAL_ADHOC, adhoc);
    setSync("Saved on this phone");
  }
  function commit() { save(); render(); }
  function persistAdhoc() {
    if (adhoc) writeJSON(LOCAL_ADHOC, adhoc);
    else try { localStorage.removeItem(LOCAL_ADHOC); } catch {}
    if (keepId && (!adhoc || adhoc.id !== keepId)) keepId = null;
    if (keepId) writeJSON(LOCAL_KEEP, keepId); else try { localStorage.removeItem(LOCAL_KEEP); } catch {}
  }
  const persistFavs = () => writeJSON(LOCAL_FAVS, favs);
  const persistRemoved = () => writeJSON(LOCAL_REMOVED, removed);
  const persistSettings = () => writeJSON(LOCAL_SETTINGS, settings);
  function setSync(t) { syncMsg = t; document.querySelectorAll(".sync").forEach(el => el.textContent = t); }

  /* ---------- History persistence ---------- */
  function persistLocalLogs() { writeJSON(LOCAL_LOGS, logs); }
  function putLog(log) {
    const i = logs.findIndex(l => l.id === log.id);
    if (i >= 0) logs[i] = log; else logs.push(log);
    persistLocalLogs(); render();
  }
  function removeLog(id) { logs = logs.filter(l => l.id !== id); persistLocalLogs(); render(); }

  function loadAll() {
    const r = readJSON(LOCAL_REMOVED); removed = Array.isArray(r) ? r.filter(x => x && x.workout) : [];
    const ok = migrate();
    const saved = readJSON(LOCAL_SAVED);
    if (ok && saved) state = { days: normalizeWorkouts(saved.workouts) };
    else state = { days: v1DaysToSaved(readJSON(LOCAL_KEY)?.days) };   // migration couldn't write: run on an in-memory copy
    // An older cached copy of the app may still have added header Days after migrating: bring new ones over too.
    const meta = readJSON(LOCAL_META), v1 = readJSON(LOCAL_KEY);
    if (ok && meta && v1?.updatedAt > (meta.v1SeenAt || 0)) {
      const fresh = v1DaysToSaved(v1.days).filter(w => !state.days.some(x => x.id === w.id));
      if (fresh.length) { fresh.forEach(w => w.name = uniqueName(w.name)); state.days = addMissing(state.days, fresh); writeJSON(LOCAL_SAVED, { dataVersion: DATA_VERSION, workouts: state.days, updatedAt: Date.now() }); }
      writeJSON(LOCAL_META, { ...meta, v1SeenAt: v1.updatedAt });
    }
    const l = readJSON(LOCAL_LOGS); logs = Array.isArray(l) ? l : [];
    const f = readJSON(LOCAL_FAVS); favs = Array.isArray(f) ? f.filter(id => typeof id === "string") : [];
    const s = readJSON(LOCAL_SETTINGS); settings = s && typeof s === "object" ? s : {};
    const c = readJSON(LOCAL_EXERCISES); customEx = cleanCustom(c);
    // Ad hoc drafts from an earlier day expire (owner's choice, see CLAUDE.md) unless marked "Keep active".
    const a = readJSON(LOCAL_ADHOC), k = readJSON(LOCAL_KEEP);
    keepId = typeof k === "string" ? k : null;
    if (a && a.id && (a.date === todayStr() || a.id === keepId)) adhoc = a;
    else { adhoc = null; if (a !== null) try { localStorage.removeItem(LOCAL_ADHOC); } catch {} }
    if (keepId && (!adhoc || adhoc.id !== keepId)) { keepId = null; try { localStorage.removeItem(LOCAL_KEEP); } catch {} }
  }

  function boot() {
    mode = "local";
    loadAll();
    try { navigator.storage?.persist?.(); } catch {}
    setSync("Saved on this phone");
    render();
    handleShareLink();
  }

  /* ---------- workout session (today) ---------- */
  const sessionId = day => day === adhoc ? day.id : `w_${todayStr()}_${day.id}`;
  const sessionFor = day => logs.find(l => l.id === sessionId(day));
  function toggleComplete(ei) {
    const day = curDay(), isAdhoc = day === adhoc;
    // A kept-active ad hoc workout resumed on a later day logs under that day, not the day it was built.
    if (isAdhoc && adhoc.date !== todayStr() && !sessionFor(adhoc)) {
      const wasKept = keepId === adhoc.id;
      adhoc.date = todayStr(); adhoc.id = `w_${adhoc.date}_adhoc_${uid()}`;
      if (wasKept) keepId = adhoc.id;
      persistAdhoc();
    }
    const ex = day.exercises[ei], existing = sessionFor(day);
    const log = existing ? JSON.parse(JSON.stringify(existing)) : isAdhoc ? {
      id: day.id, type: "workout", adhoc: true, date: day.date, ts: Date.now(), ...(day.repeatOf ? { repeatOf: day.repeatOf } : {}),
      dayId: null, dayNum: null, dayName: day.name, total: day.exercises.length, done: []
    } : {
      id: sessionId(day), type: "workout", date: todayStr(), ts: Date.now(),
      dayId: day.id, dayNum: null, dayName: day.name, total: day.exercises.length, done: []
    };
    const i = log.done.findIndex(d => d.exId === ex.id);
    if (i >= 0) log.done.splice(i, 1);
    else log.done.push({ exId: ex.id, name: ex.name, sets: JSON.parse(JSON.stringify(ex.sets)) });
    log.total = day.exercises.length; log.updatedTs = Date.now();
    if (isAdhoc || !log.dayNum) log.dayName = day.name;   // keep version-1 logs' original Day label
    if (!log.done.length) removeLog(log.id); else putLog(log);
  }

  /* ---------- render ---------- */
  let dragging = null;
  const GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
  function render() {
    if (dragging) return;
    const main = $("#main");
    if (mode === "loading") { main.innerHTML = `<div class="empty-state"><strong>Loading…</strong></div>`; return; }
    if (view === "adhoc" && !adhoc) view = "home";
    if (view === "detail" && !state.days[detailIdx]) view = "home";
    if (typeof view === "number" && !state.days[view]) view = "home";
    renderTopbar();
    main.innerHTML = view === "home" ? renderHome() : view === "settings" ? renderSettings()
      : renderDay(curDay(), view === "detail" ? "detail" : view === "adhoc" ? "adhoc" : "session");
  }

  function renderTopbar() {
    const cur = curDay(), onSaved = (view === "detail" || typeof view === "number") && cur;
    const items = savedOrder();
    $("#tabs").innerHTML = `
      <button class="tb" data-view="home" aria-current="${view === "home"}">Home</button>
      <div class="dd">

        </button>

        </div>
      </div>
      <button class="tb icon" data-view="settings" aria-current="${view === "settings"}" aria-label="Settings">${GEAR}</button>`;
  }

  /* ---------- iPhone install tip ---------- */
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isStandalone = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  function installTip() {
    if (!isIOS() || isStandalone() || settings.tipDismissed) return "";

      <div><b>Add Workout Split to your Home Screen</b>
      Tap <span class="share-ic" aria-label="Share">${SHARE_IC}</span> Share, then <b class="inl">Add to Home Screen</b>. Your data is safer there: Safari can clear website data you haven't used in a while.

  }
  const PENCIL_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
  const TRASH_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
  // Paper airplane for the saved-workout Share button. SHARE_IC (below) stays for the iPhone install tip, where it mirrors Safari's own Share icon.
  const SEND_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>';
  const SHARE_IC = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';

  function renderHome() {
    const ws = weekStart(), inWeek = sortedLogs().filter(l => parseDate(l.date) >= ws);
    const cnt = t => inWeek.filter(l => l.type === t).length;
    const recent = sortedLogs().slice(0, 15);
    return `
      ${installTip()}
      <header class="head"><h1>Training <span>Log</span></h1><div class="total">${fmtDate(todayStr())}</div></header>
      <div class="sub"><span>Workouts, cardio, sauna and more</span></div>

      </div>

        <div><b>${cnt("workout")}</b><small>Workouts</small></div>
        <div><b>${cnt("cardio")}</b><small>Cardio</small></div>
        <div><b>${cnt("sauna")}</b><small>Sauna</small></div>

  }

  /* ---------- settings ---------- */
  function renderSettings() {
    const last = settings.lastExport ? fmtDate(settings.lastExport.slice(0, 10)) : "Never";
    return `
      <header class="head"><h1>Settings</h1></header>
      ${installTip()}
      <div class="section-label">Backup</div>
      <div class="panel">
        <p class="pnote">Save a backup file to Files, iCloud, Google Drive or email. It has your saved workouts, favorites, history, sets, reps and weights.</p>

      </div>

        ${removed.length ? removed.slice().reverse().map((r, ri) => { const i = removed.length - 1 - ri; return `
          <div class="removed"><span><b>${esc(r.workout.name)}</b><small>Removed ${esc(fmtDate(String(r.removedAt).slice(0, 10)))}</small></span>
          <button class="btn-sm" data-act="restore-removed" data-i="${i}">Restore</button></div>`; }).join("")
          : `<p class="pnote">Nothing here. Saved workouts you remove show up here so you can restore them.</p>`}
      </div>

        <button class="btn" data-act="check-update">Check for updates</button>
      </div>
      <p class="foot">Everything stays on this phone. There's no account and no server.</p>`;
  }

  /* ---------- calendar ---------- */
  const TYPE_ORDER = ["workout", "cardio", "sauna", "misc"];
  const thisMonth = () => todayStr().slice(0, 7);
  function shiftMonth(ym, by) { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + by, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
  function renderCalendar() {
    const ym = calMonth || thisMonth(), [y, m] = ym.split("-").map(Number);
    const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;   // Monday-first, like "This week"
    const count = new Date(y, m, 0).getDate(), today = todayStr();
    const byDate = {};
    logs.forEach(l => { if (l.date?.startsWith(ym)) (byDate[l.date] ||= []).push(l); });
    let cells = "";
    for (let i = 0; i < lead; i++) cells += `<span></span>`;
    for (let d = 1; d <= count; d++) {
      const ds = `${ym}-${String(d).padStart(2, "0")}`, items = byDate[ds] || [];
      const types = TYPE_ORDER.filter(t => items.some(l => l.type === t));
      const cls = `cal-day${items.length ? " has" : ""}${ds === today ? " today" : ""}`;

    </div>`;
  }
  function calDaySheet(ds) {
    const items = logs.filter(l => l.date === ds).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    if (!items.length) return;
    openSheet(`
      <h2>${esc(fmtDate(ds))} <em>${items.length} entr${items.length === 1 ? "y" : "ies"}</em></h2>

        <button class="entry" data-id="${esc(l.id)}">

  // One screen, three modes:
  //  "detail"  saved workout: view and edit it, favorite/share/rename/remove, Start Workout at the bottom
  //  "session" saved workout in progress: Complete each exercise
  //  "adhoc"   ad hoc workout (building or doing it): Complete, Save?, Keep active, Delete
  const HEART_FULL = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.8 4.5c2.1 0 3.6 1.1 4.6 2.6.2.3.6.3.8 0 1-1.5 2.5-2.6 4.6-2.6 3.8 0 5.9 3.8 4.4 7.2C19.5 16.4 12 21 12 21z"/></svg>';
  const HEART_LINE = HEART_FULL.replace('fill="currentColor"', 'fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"');
  function renderDay(d, kind) {
    if (!d) return "";
    const doing = kind !== "detail";
    const sess = doing ? sessionFor(d) : null;
    const doneIds = new Set((sess?.done || []).map(x => x.exId));
    const n = d.exercises.filter(e => doneIds.has(e.id)).length, tot = d.exercises.length;
    const tag = kind === "adhoc" ? (d.name === "Ad Hoc" ? "Workout" : "Ad Hoc") : kind === "session" ? "In progress" : "";
    const fav = isFav(d);
    const head = `
      <header class="head">
        <h1><button data-act="edit-day" aria-label="${kind === "adhoc" ? "Rename ad hoc workout" : "Rename workout"}">${esc(d.name)}${tag ? ` <span>${tag}</span>` : ""}</button></h1>
        <div class="total">${totalSets(d)} sets</div>
      </header>
      <div class="sub"><span>${kind === "detail" ? `Saved workout${fav ? " · ♥ Favorite" : ""}` : "Reps@lbs · BW = bodyweight"}</span></div>`;

        <button class="act fav ${fav ? "on" : ""}" data-act="fav" aria-pressed="${fav}" aria-label="${fav ? "Favorite (tap to remove)" : "Add to Favorites"}">${fav ? HEART_FULL : HEART_LINE}</button>
        <button class="act ico" data-act="share" aria-label="Share workout">${SEND_IC}</button>
        <button class="act ico" data-act="edit-day" aria-label="Rename workout">${PENCIL_IC}</button>

      </div>` : "";
    const progress = doing && tot ? `<div class="session"><span>Today</span><span class="bar"><i style="width:${n / tot * 100}%"></i></span><b>${n}/${tot} done</b></div>` : "";
    const cards = d.exercises.map((e, ei) => { const done = doneIds.has(e.id); return `
          <article class="card ${done ? "done" : ""}" data-idx="${ei}">
            <div class="handle" data-handle="${ei}" role="button" tabindex="0" aria-label="Reorder ${esc(e.name)}. Drag, or use arrow keys">${ICONS.grip}</div>
            <div class="num">${ei + 1}</div>
