              <div class="trow">
                <button class="title" data-act="edit-ex" data-ex="${ei}"><b>${esc(e.name)}</b><small>${e.sets.length} set${e.sets.length === 1 ? "" : "s"} · tap to edit</small></button>
                ${doing ? `<button class="complete" aria-pressed="${done}" data-act="complete" data-ex="${ei}">${done ? ICONS.check + "Done" : "Complete"}</button>` : ""}
              </div>
              <div class="sets">
                ${e.sets.map((s, si) => `
                  <button class="chip ${fmtSet(s) === "Tap to set" ? "empty" : ""}" data-act="edit-set" data-ex="${ei}" data-set="${si}"><i>S${si + 1}</i>${esc(fmtSet(s))}</button>`).join("")}
              </div>
            </div>
          </article>`; }).join("");
    const kept = kind === "adhoc" && keepId === d.id;
    const foot = kind === "detail"
      ? `<button class="btn primary start" data-act="start">Start Workout</button>`
      : kind === "session"
      ? `<button class="btn" data-act="back-detail">Back to workout details</button>
         <p class="foot">Add weight or reps once all sets feel strong</p>`
      : `<button class="btn primary" data-act="finish-adhoc">Finish ad hoc workout</button>
         <div class="inline">
           <button class="btn" data-act="save-adhoc">Save?</button>
           <button class="btn ${kept ? "kept" : ""}" data-act="keep-adhoc" aria-pressed="${kept}">${kept ? "Kept active ✓" : "Keep active"}</button>
         </div>
         <button class="btn danger" data-act="delete-adhoc">Delete</button>
         <p class="foot">${kept ? "Kept active: this workout stays until you finish or delete it." : "One-off session, logged on your calendar. It clears tomorrow unless you tap Keep active."}</p>`;
    return `${head}${actions}${progress}
      <section class="list">
        ${cards}
        <button class="addex" data-act="add-ex">+ Add exercise</button>
      </section>
      ${foot}`;
  }

  /* ---------- sheets ---------- */
  let sheetOpen = false;
  // Lower the phone keyboard. iOS can carry an open keyboard over to the next screen's text field,
  // so every sheet change starts with it closed; a field only gets the keyboard when tapped
  // (or when a sheet deliberately focuses it, like naming a new workout).
  const hideKeyboard = () => { const a = document.activeElement; if (a && a !== document.body && a.matches?.("input,textarea,select,[contenteditable]")) a.blur(); };
  function openSheet(html, bind) {
    const sheet = $("#sheet"), scrim = $("#scrim");
    hideKeyboard();
    $("#sheetInner").innerHTML = `<div class="grab"></div>` + html;
    if (!sheetOpen) { try { history.pushState({ sheet: 1 }, ""); } catch {} }
    sheet.hidden = false; scrim.hidden = false; sheetOpen = true; sheet.scrollTop = 0;
    requestAnimationFrame(() => { sheet.classList.add("on"); scrim.classList.add("on"); });
    bind?.($("#sheetInner"));
  }
  function closeSheet() {
    if (sheetOpen && history.state && history.state.sheet) { history.back(); return; }
    reallyClose();
  }
  window.addEventListener("popstate", () => { if (sheetOpen) reallyClose(); });
  function reallyClose() {
    const sheet = $("#sheet"), scrim = $("#scrim");
    hideKeyboard();
    sheet.classList.remove("on"); scrim.classList.remove("on"); sheetOpen = false;
    setTimeout(() => { if (!sheetOpen) { sheet.hidden = true; scrim.hidden = true; } }, 230);
    render();
  }
  $("#scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetOpen) closeSheet(); });

  function confirmInto(root, msg, label, onYes, boxSel = "#confirm") {
    const box = $(boxSel, root);
    box.innerHTML = `<div class="confirm">${msg}<div class="inline"><button class="btn danger" id="c-yes">${label}</button><button class="btn" id="c-no">Keep</button></div></div>`;
    $("#c-yes", root).onclick = onYes;
    $("#c-no", root).onclick = () => { box.innerHTML = ""; };
  }

  // Reps listed smallest first (1 at the top, 50 at the bottom). A stored value outside 1–50 is kept as an option so it's never lost.
  function repOpts(cur) {
    const vals = Array.from({ length: 50 }, (_, i) => i + 1);
    if (typeof cur === "number" && !vals.includes(cur)) { vals.push(cur); vals.sort((a, b) => a - b); }
    return `<option value="">—</option>` + vals.map(n => `<option value="${n}" ${cur == n ? "selected" : ""}>${n}</option>`).join("");
  }
  function weightOpts(cur) {
    const vals = []; for (let w = 2.5; w <= 600; w += 2.5) vals.push(+w.toFixed(1));
    if (typeof cur === "number" && !vals.includes(cur)) { vals.push(cur); vals.sort((a, b) => a - b); }
    return `<option value="">—</option><option value="BW" ${cur === "BW" ? "selected" : ""}>BW (bodyweight)</option>`
      + vals.map(v => `<option value="${v}" ${cur === v ? "selected" : ""}>${v} lb</option>`).join("");
  }

  function setSheet(ei, si) {
    const ex = curDay().exercises[ei], s = ex.sets[si];
    const draft = { ...s };
    openSheet(`
      <h2>${esc(ex.name)} · <em>Set ${si + 1}</em></h2>
      <div class="preview" id="pv">${esc(fmtSet(draft))}</div>
      <div class="row2">
        <div class="field"><label for="f-reps">Reps</label><select id="f-reps">${repOpts(draft.r)}</select></div>
        <div class="field"><label for="f-wt">Weight</label><select id="f-wt">${weightOpts(draft.w)}</select></div>
      </div>
      <label class="check"><input type="checkbox" id="f-pair" ${draft.pair ? "checked" : ""}> Per hand (×2), e.g. carries</label>
      <div class="btns">
        <button class="btn primary" id="b-save">Save set</button>
        ${si < ex.sets.length - 1 ? `<button class="btn" id="b-rest">Save &amp; apply to sets ${si + 1}–${ex.sets.length}</button>` : ""}
        <button class="btn ghost" id="b-cancel">Cancel</button>
      </div>`, root => {
      root.addEventListener("change", () => {
        const r = $("#f-reps", root).value, w = $("#f-wt", root).value;
        draft.r = r === "" ? null : +r;
        draft.w = w === "" ? null : (w === "BW" ? "BW" : +w);
        draft.pair = $("#f-pair", root).checked;
        $("#pv", root).textContent = fmtSet(draft);
      });
      $("#b-save", root).onclick = () => { ex.sets[si] = { ...draft }; commit(); closeSheet(); };
      const rest = $("#b-rest", root);
      if (rest) rest.onclick = () => { for (let k = si; k < ex.sets.length; k++) ex.sets[k] = { ...draft }; commit(); closeSheet(); };
      $("#b-cancel", root).onclick = closeSheet;
    });
  }

  // Add exercise: pick from the library (sorted by body part, then A–Z) or type a new one.
  function addExSheet() {
    const day = curDay(), lib = library();
    let pick = null, sets = [], pair = false, parts = [];
    openSheet(`
      <h2>Add <em>exercise</em></h2>
      <div class="field"><label for="f-ex">Exercise</label>
        <input type="text" id="f-ex" placeholder="Search, or type a new exercise" maxlength="60" autocomplete="off" role="combobox" aria-controls="ex-list" aria-expanded="true"></div>
      <div class="exlist" id="ex-list" role="listbox" aria-label="Exercises"></div>
      <div id="ex-form" class="btns" hidden></div>
      <div class="err" id="err"></div>
      <div class="btns">
        <button class="btn primary" id="b-save">Add exercise</button>
        <button class="btn ghost" id="b-cancel">Cancel</button>
      </div>`, root => {
      const input = $("#f-ex", root), list = $("#ex-list", root), form = $("#ex-form", root), err = $("#err", root);

      function showList() {
        const q = exKey(input.value), raw = input.value.trim();
        const hits = q ? lib.filter(e => exKey(e.name).includes(q)) : lib;
        const exact = q && lib.some(e => exKey(e.name) === q);
        let html = raw && !exact ? `<button class="opt new" data-new="1">+ Add “${esc(raw)}” as a new exercise</button>` : "";
        [...BODY_PARTS, OTHER].forEach(part => {
          const inPart = hits.filter(e => e.parts.includes(part)).sort((a, b) => a.name.localeCompare(b.name));
          if (!inPart.length) return;
          html += `<div class="grp">${esc(part === OTHER ? "My other exercises" : part)}</div>`
            + inPart.map(e => `<button class="opt" role="option" data-key="${esc(exKey(e.name))}"><span>${esc(e.name)}${e.star ? ` <span class="star" aria-label="starred">★</span>` : ""}</span>${e.custom ? "<small>yours</small>" : ""}</button>`).join("");
        });
        if (!html) html = `<div class="none">No matches.</div>`;
        list.innerHTML = html; list.hidden = false; list.scrollTop = 0;
        input.setAttribute("aria-expanded", "true");
      }

      function choose(entry, isNew) {
        const hist = isNew ? null : lastSetsFor(entry.name);
        pick = { name: entry.name, isNew };
        parts = [];
        pair = !!hist?.sets.some(s => s.pair);
        sets = hist ? hist.sets.slice(0, MAX_SETS).map(s => ({ r: s.r ?? null, w: s.w ?? null })) : [{ r: null, w: null }];
        input.value = entry.name;
        list.hidden = true; input.setAttribute("aria-expanded", "false");
        err.textContent = "";
        const note = isNew
          ? `<div class="hint prompt">New exercise. Check the body parts it works, then choose your sets, reps and weight.</div>`
          : hist?.from === "log" ? `<div class="hint">Filled in from your last ${esc(entry.name)} on ${esc(fmtDate(hist.date))}. Change anything you like.</div>`
          : hist ? `<div class="hint">Filled in from your saved workout ${esc(hist.dayName)}. Change anything you like.</div>`
          : `<div class="hint prompt">You haven't logged this one yet. Choose your sets, reps and weight.</div>`;
        form.innerHTML = note
          + (isNew ? `<div class="field"><span class="lbl">Body parts (pick all that apply)</span><div class="parts">${BODY_PARTS.map(p => `<label class="check"><input type="checkbox" data-part="${esc(p)}"> ${esc(p)}</label>`).join("")}</div></div>` : "")
          + `<div class="field"><span class="lbl">Number of sets</span>
               <div class="stepper"><button id="s-minus" aria-label="Fewer sets">−</button><output id="s-n">${sets.length}</output><button id="s-plus" aria-label="More sets">+</button></div></div>
             <div class="field"><span class="lbl">Reps and weight</span><div class="setrows" id="rows"></div></div>
             <label class="check"><input type="checkbox" id="f-pair" ${pair ? "checked" : ""}> Per hand (×2), e.g. carries</label>`;
        form.hidden = false;
        drawRows();
        $("#s-minus", form).onclick = () => { if (sets.length > 1) { sets.pop(); drawRows(); } };
        $("#s-plus", form).onclick = () => { if (sets.length < MAX_SETS) { sets.push({ ...sets[sets.length - 1] }); drawRows(); } };
      }

      function drawRows() {
        $("#s-n", form).textContent = sets.length;
        $("#rows", form).innerHTML = sets.map((s, i) => `<div class="setrow"><i>S${i + 1}</i>
          <select data-i="${i}" data-f="r" aria-label="Set ${i + 1} reps">${repOpts(s.r).replace('<option value="">—</option>', '<option value="">Reps</option>')}</select>
          <select data-i="${i}" data-f="w" aria-label="Set ${i + 1} weight">${weightOpts(s.w).replace('<option value="">—</option>', '<option value="">Weight</option>')}</select></div>`).join("");
      }

      input.addEventListener("input", () => { pick = null; form.hidden = true; form.innerHTML = ""; showList(); });
      input.addEventListener("focus", () => { if (pick) input.select(); });
      list.addEventListener("click", e => {
        const b = e.target.closest(".opt"); if (!b) return;
        if (b.dataset.new) choose({ name: input.value.trim().replace(/\s+/g, " ") }, true);
        else choose(lib.find(x => exKey(x.name) === b.dataset.key), false);
      });
      form.addEventListener("change", e => {
        const t = e.target;
        if (t.dataset.part) parts = [...form.querySelectorAll("[data-part]:checked")].map(x => x.dataset.part);
        else if (t.id === "f-pair") pair = t.checked;
        else if (t.dataset.f) {
          const v = t.value, i = +t.dataset.i;
          sets[i][t.dataset.f] = v === "" ? null : t.dataset.f === "w" && v === "BW" ? "BW" : +v;
          t.classList.remove("missing");
        }
      });
      $("#b-save", root).onclick = () => {
        if (!pick) {
          const k = exKey(input.value), match = k && lib.find(x => exKey(x.name) === k);
          if (match) { choose(match, false); return; }
          return err.textContent = input.value.trim() ? "Pick an exercise from the list, or tap “Add as a new exercise”." : "Choose an exercise.";
        }
        if (pick.isNew && !parts.length) return err.textContent = "Check at least one body part.";
        const missing = sets.findIndex(s => s.r == null && s.w == null);
        if (missing >= 0) {
          form.querySelectorAll(`[data-i="${missing}"]`).forEach(s => s.classList.add("missing"));
          return err.textContent = `Set ${missing + 1} needs reps or weight.`;
        }
        day.exercises.push({ id: uid(), name: pick.name, sets: sets.map(s => ({ r: s.r, w: s.w, pair })) });
        if (pick.isNew && !customEx.some(e => exKey(e.name) === exKey(pick.name))) { customEx.push({ name: pick.name, parts }); persistCustom(); }
        commit(); closeSheet();
      };
      $("#b-cancel", root).onclick = closeSheet;
      showList();
      setTimeout(() => { if (document.activeElement === input) input.blur(); }, 0);   // keyboard only when the field is tapped
    });
  }

  function exSheet(ei) {
    if (ei == null) return addExSheet();
    const day = curDay();
    const isNew = ei == null;
    const ex = isNew ? { id: uid(), name: "", sets: [0,1,2].map(() => ({ r: 10, w: null, pair: false })) } : day.exercises[ei];
    let n = ex.sets.length;
    openSheet(`
      <h2>${isNew ? "Add exercise" : "Edit exercise"}</h2>
      <div class="field"><label for="f-name">Exercise name</label>
        <input type="text" id="f-name" value="${esc(ex.name)}" placeholder="e.g. Romanian Deadlift" maxlength="60" autocomplete="off"></div>
      <div class="field"><span class="lbl">Number of sets</span>
        <div class="stepper"><button id="s-minus" aria-label="Fewer sets">−</button><output id="s-n">${n}</output><button id="s-plus" aria-label="More sets">+</button></div></div>
      ${isNew ? "" : `<div class="inline">
        <button class="btn" id="b-up" ${ei === 0 ? "disabled" : ""}>Move up</button>
        <button class="btn" id="b-down" ${ei === day.exercises.length - 1 ? "disabled" : ""}>Move down</button></div>`}
      <div class="btns">
        <button class="btn primary" id="b-save">${isNew ? "Add exercise" : "Save"}</button>
        ${isNew ? "" : `<button class="btn danger" id="b-del">Remove exercise</button><div id="confirm"></div>`}
        <button class="btn ghost" id="b-cancel">Cancel</button>
      </div>`, root => {
      const out = $("#s-n", root);
      $("#s-minus", root).onclick = () => { n = Math.max(1, n - 1); out.textContent = n; };
      $("#s-plus", root).onclick = () => { n = Math.min(MAX_SETS, n + 1); out.textContent = n; };
      $("#b-save", root).onclick = () => {
        ex.name = $("#f-name", root).value.trim() || "New Exercise";
        while (ex.sets.length < n) ex.sets.push({ ...(ex.sets[ex.sets.length - 1] || { r: 10, w: null, pair: false }) });
        ex.sets.length = n;
        if (isNew) day.exercises.push(ex);
        commit(); closeSheet();
      };
      $("#b-cancel", root).onclick = closeSheet;
      if (!isNew) {
        const move = dir => { const a = day.exercises; const [x] = a.splice(ei, 1); a.splice(ei + dir, 0, x); commit(); closeSheet(); };
        $("#b-up", root).onclick = () => move(-1);
        $("#b-down", root).onclick = () => move(1);
        $("#b-del", root).onclick = () => confirmInto(root, `Remove ${esc(ex.name)} and its ${ex.sets.length} sets? Past logs keep their record.`, "Remove",
          () => { day.exercises.splice(ei, 1); commit(); closeSheet(); });
      }
      if (isNew) setTimeout(() => $("#f-name", root)?.focus(), 250);
    });
  }

  /* ---------- Saved Workouts ---------- */
  const copyExercises = list => (list || []).map(e => ({ id: uid(), name: String(e.name || "Exercise"), sets: (e.sets || []).slice(0, MAX_SETS).map(cleanSet) }));
  function openSaved(i) { ddOpen = false; detailIdx = i; view = "detail"; render(); window.scrollTo({ top: 0 }); }

  // Ask for a name that isn't blank and isn't already used by another saved workout.
  function nameSheet({ title, label, value = "", button, exceptId, extra = "", onSave }) {
    openSheet(`
      <h2>${title}</h2>
      <div class="field"><label for="f-wname">${label}</label>
        <input type="text" id="f-wname" value="${esc(value)}" placeholder="e.g. Upper Body, Legs, Hotel Gym" maxlength="40" autocomplete="off" enterkeyhint="done"></div>
      ${extra}
      <div class="err" id="err"></div>
      <div class="btns">
        <button class="btn primary" id="b-save">${button}</button>
        <button class="btn ghost" id="b-cancel">Cancel</button>
      </div>`, root => {
      const input = $("#f-wname", root), err = $("#err", root);
      const go = () => {
        const name = input.value.trim().replace(/\s+/g, " ");
        if (!name) return err.textContent = "Enter a name.";
        if (nameTaken(name, exceptId)) return err.textContent = `You already have a saved workout called “${name}”. Pick a different name.`;
        onSave(name, root);
      };
      $("#b-save", root).onclick = go;
      input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      $("#b-cancel", root).onclick = closeSheet;
      setTimeout(() => { input.focus(); input.select(); }, 250);
    });
  }

  function newSavedSheet() {
    ddOpen = false; render();
    nameSheet({
      title: "New <em>saved workout</em>", label: "Workout name", button: "Create workout",
      extra: state.days.length ? `<div class="field"><label for="f-copy">Start from (optional)</label><select id="f-copy"><option value="">Empty workout</option>${savedOrder().map(w => `<option value="${esc(w.id)}">Copy of ${esc(w.name)}</option>`).join("")}</select></div>` : "",
      onSave: (name, root) => {
        const src = state.days.find(w => w.id === $("#f-copy", root)?.value);
        const w = { id: uid(), name, exercises: src ? copyExercises(src.exercises) : [], savedAt: new Date().toISOString() };
        state.days.push(w); detailIdx = state.days.length - 1; view = "detail";
        commit(); closeSheet();
        if (!w.exercises.length) setTimeout(() => exSheet(null), 240);
      }
    });
  }

  function renameSheet() {
    const w = curDay(); if (!w) return;
    if (w === adhoc) return nameSheetAdhoc();
    nameSheet({
      title: "Rename <em>workout</em>", label: "Workout name", value: w.name, button: "Save name", exceptId: w.id,
      onSave: name => { w.name = name; commit(); closeSheet(); }
    });
  }
  function nameSheetAdhoc() {
    openSheet(`
      <h2>Ad hoc <em>workout</em></h2>
      <div class="field"><label for="f-day">Workout name</label>
        <input type="text" id="f-day" value="${esc(adhoc.name)}" placeholder="e.g. Hotel gym, Arms" maxlength="30" autocomplete="off"></div>
      <div class="btns">
        <button class="btn primary" id="b-save">Save name</button>
        <button class="btn ghost" id="b-cancel">Cancel</button>
      </div>`, root => {
      $("#b-save", root).onclick = () => {
        adhoc.name = $("#f-day", root).value.trim() || "Ad Hoc";
        const log = sessionFor(adhoc);
        if (log) putLog({ ...log, dayName: adhoc.name, updatedTs: Date.now() });
        commit(); closeSheet();
      };
      $("#b-cancel", root).onclick = closeSheet;
    });
  }

  // "Save?": copy a workout (ad hoc, or one from History) into Saved Workouts under a new name. The source is unchanged.
  function saveAsSheet(exercises, suggested) {
    if (!exercises.length) return toast("Add an exercise first, then save.");
    nameSheet({
      title: "Save to <em>Saved Workouts</em>", label: "Name for this saved workout", value: uniqueName(suggested || "Workout"), button: "Save workout",
      extra: `<p class="pnote">This saves a copy with ${exercises.length} exercise${exercises.length === 1 ? "" : "s"}. The original stays as it is.</p>`,
      onSave: name => {
        state.days.push({ id: uid(), name, exercises: copyExercises(exercises), savedAt: new Date().toISOString() });
        commit(); closeSheet(); toast(`Saved “${name}” to Saved Workouts`);
      }
    });
  }

  function toggleFav() {
    const w = curDay(); if (!w || w === adhoc) return;
    favs = isFav(w) ? favs.filter(id => id !== w.id) : [...favs, w.id];
    persistFavs(); render();
    toast(isFav(w) ? "Added to Favorites" : "Removed from Favorites");
  }

  // Remove moves the workout to "Recently removed" (Settings), where it can be restored. Nothing is erased; History is untouched.
  function removeSavedSheet() {
    const w = curDay(); if (!w || w === adhoc) return;
    openSheet(`
      <h2>Remove <em>${esc(w.name)}</em>?</h2>
      <p class="pnote">It leaves Saved Workouts${isFav(w) ? " and Favorites" : ""}. Your History isn't affected, and you can restore it from Settings → Recently removed.</p>
      <div class="btns">
        <button class="btn danger" id="b-yes">Remove from Saved Workouts</button>
        <button class="btn ghost" id="b-cancel">Keep it</button>
      </div>`, root => {
      $("#b-yes", root).onclick = () => {
        removed.push({ workout: JSON.parse(JSON.stringify(w)), removedAt: new Date().toISOString(), wasFavorite: isFav(w) });
        if (!persistRemoved()) { removed.pop(); return; }   // only drop it from the list once it's safely in Recently removed
        favs = favs.filter(id => id !== w.id); persistFavs();
        state.days = state.days.filter(x => x !== w); view = "home";
        commit(); closeSheet(); toast(`Removed “${w.name}”`);
      };
      $("#b-cancel", root).onclick = closeSheet;
    });
  }
  function restoreRemoved(i) {
    const r = removed[i]; if (!r) return;
    const w = normalizeWorkout(r.workout);
    if (state.days.some(x => x.id === w.id)) w.id = uid();
    w.name = uniqueName(w.name);
    state.days.push(w);
    if (r.wasFavorite) { favs.push(w.id); persistFavs(); }
    save();
    removed.splice(i, 1); persistRemoved();
    render(); toast(`Restored “${w.name}”`);
  }

  function pickDaySheet() {
    const next = nextInRotation(), items = savedOrder();
    openSheet(`
      <h2>Pick a <em>workout</em></h2>
      ${items.length ? `<div class="pickdd">
        <button class="tb dd-btn" id="b-pickdd" aria-haspopup="listbox" aria-expanded="false"><span>Saved Workouts</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="pick-menu" role="listbox" aria-label="Saved Workouts" hidden>${items.map(w => `
          <button class="dd-item" role="option" data-i="${state.days.indexOf(w)}">
            <span><b>${esc(w.name)}${w === next ? ` <span class="tag">Next</span>` : ""}</b><small>${w.exercises.length} exercises · ${totalSets(w)} sets</small></span>
            ${isFav(w) ? `<span class="heart" aria-label="Favorite">♥</span>` : ""}
          </button>`).join("")}</div>
      </div>`
        : `<p class="meta">No saved workouts yet. Create one, or start an ad hoc workout.</p>`}
      <div class="or">or</div>
      <div class="adhoc-pick">
        ${adhoc ? `<button class="resume" id="b-adhoc-resume"><span class="ic">${ICONS.workout}</span><span><b>Continue ${esc(adhoc.name)}</b><small>Ad hoc workout${keepId === adhoc.id ? " · kept active" : ""} · ${adhoc.exercises.length} exercise${adhoc.exercises.length === 1 ? "" : "s"}</small></span></button>` : ""}
        <button id="b-adhoc"><span class="ic">${ICONS.misc}</span><span><b>${adhoc ? "New ad hoc workout" : "Ad hoc workout"}</b><small>One-off session. Not added to Saved Workouts unless you tap Save?</small></span></button>
      </div>
      <div class="btns">
        <button class="btn" id="b-new">+ New saved workout</button>
        <button class="btn ghost" id="b-cancel">Cancel</button>
      </div>`, root => {
      const pdd = $("#b-pickdd", root);
      if (pdd) pdd.onclick = () => { const m = $(".pick-menu", root), open = m.hidden; m.hidden = !open; pdd.setAttribute("aria-expanded", String(open)); };
      root.querySelectorAll(".pick-menu .dd-item").forEach(b => b.onclick = () => { closeSheet(); setTimeout(() => openSaved(+b.dataset.i), 0); });
      $("#b-new", root).onclick = () => { closeSheet(); setTimeout(newSavedSheet, 240); };
      const rb = $("#b-adhoc-resume", root); if (rb) rb.onclick = () => { view = "adhoc"; closeSheet(); window.scrollTo({ top: 0 }); };
      $("#b-adhoc", root).onclick = () => {
        const go = () => { startAdhoc(); closeSheet(); window.scrollTo({ top: 0 }); setTimeout(() => exSheet(null), 240); };
        if (!adhoc || !adhoc.exercises.length) return go();
        confirmInto(root, `Start a new ad hoc workout? “${esc(adhoc.name)}” will be cleared${sessionFor(adhoc) ? "; its completed exercises stay in History" : ""}.`, "Start new", go, "#confirm-new");
      };
      $("#b-cancel", root).onclick = closeSheet;
    });
    $("#sheetInner .adhoc-pick").insertAdjacentHTML("afterend", `<div id="confirm-new"></div>`);
  }

  /* ---------- ad hoc workout (one-off; becomes a Saved Workout only via Save?) ---------- */
  function startAdhoc() {
    const date = todayStr();
    adhoc = { id: `w_${date}_adhoc_${uid()}`, adhoc: true, name: "Ad Hoc", date, exercises: [] };
    keepId = null; persistAdhoc(); view = "adhoc";
  }
  // Repeat a past workout: an ad hoc session pre-loaded with the exercises completed that day
  // and the sets recorded then. Editable like any session; doesn't move the rotation.
  function repeatWorkout(l) {
    const date = todayStr();
    adhoc = {
      id: `w_${date}_adhoc_${uid()}`, adhoc: true, date, repeatOf: l.id,
      name: workoutName(l).slice(0, 30),
      exercises: copyExercises(l.done)
    };

  /* ---------- backup: export ---------- */
  function bundle() {

  async function exportData() {

  /* ---------- backup: import (validated, migrated, all-or-nothing) ---------- */
  const isDateStr = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const LOG_TYPES = ["workout", "cardio", "sauna", "misc"];
  // Accepts every backup format: version 1 ({version:1, days, logs}) and version 2 ({dataVersion:2, saved, ...}).
  function parseBackup(text) {
    let o;
    try { o = JSON.parse(String(text).trim()); } catch { return { error: "That file isn't a Workout Split backup (it couldn't be read)." }; }
    if (!o || typeof o !== "object" || Array.isArray(o)) return { error: "That file isn't a Workout Split backup." };
    if (o.app && o.app !== "workout-split") return { error: "That backup is from a different app." };
    const ver = o.dataVersion || (Array.isArray(o.days) ? 1 : 0);
    if (!ver) return { error: "That file doesn't contain any Workout Split data." };
    if (ver > DATA_VERSION) return { error: "That backup was made by a newer version of the app. Update the app (Settings → Check for updates), then try again." };
    let saved, favorites;
    if (ver === 1) { saved = v1DaysToSaved(o.days); favorites = saved.map(w => w.id); }
    else {
      if (!Array.isArray(o.saved)) return { error: "That backup is missing its saved workouts." };
      saved = normalizeWorkouts(o.saved);
      favorites = (Array.isArray(o.favorites) ? o.favorites : []).filter(id => saved.some(w => w.id === id));
    }
    const logsIn = o.logs == null ? [] : o.logs;
    if (!Array.isArray(logsIn)) return { error: "That backup's history is damaged." };
    for (const l of logsIn) {
      if (!l || typeof l.id !== "string" || !LOG_TYPES.includes(l.type) || !isDateStr(l.date)) return { error: "That backup's history is damaged, so nothing was imported." };
      if (l.type === "workout" && !Array.isArray(l.done)) return { error: "That backup's workout history is damaged, so nothing was imported." };
    }
    const removedIn = (Array.isArray(o.removed) ? o.removed : []).filter(r => r && r.workout).map(r => ({ ...r, workout: normalizeWorkout(r.workout) }));
    return { data: { version: ver, exportedAt: o.exportedAt || null, saved, favorites, removed: removedIn, logs: logsIn,
      exercises: cleanCustom(o.exercises), adhoc: o.adhoc && o.adhoc.id ? o.adhoc : null, keepActive: typeof o.keepActive === "string" ? o.keepActive : null,
      name: o.settings?.name || "" } };
  }
  // Merge never deletes: it adds what's missing. A saved workout that differs from yours is added as a copy.
  function mergedState(inc) {
    const out = { days: state.days.map(w => w), favs: [...favs], logs: [...logs], customEx: [...customEx], removed: [...removed] };
    const sameContent = (a, b) => JSON.stringify([a.name, a.exercises.map(e => [e.name, e.sets])]) === JSON.stringify([b.name, b.exercises.map(e => [e.name, e.sets])]);
    const taken = n => out.days.some(w => w.name.toLowerCase() === n.toLowerCase());
    let added = 0, copies = 0;
    inc.saved.forEach(w => {
      const mine = out.days.find(x => x.id === w.id);
      if (mine && sameContent(mine, w)) return;
      const copy = { ...w, id: mine ? uid() : w.id, name: uniqueName(mine ? `${w.name} (imported)` : w.name, taken) };
      out.days.push(copy); mine ? copies++ : added++;
      if (inc.favorites.includes(w.id) && !out.favs.includes(copy.id)) out.favs.push(copy.id);
    });
    const haveLog = new Set(out.logs.map(l => l.id)); let newLogs = 0;
    inc.logs.forEach(l => { if (!haveLog.has(l.id)) { out.logs.push(l); newLogs++; } });
    inc.exercises.forEach(e => { if (!out.customEx.some(x => exKey(x.name) === exKey(e.name))) out.customEx.push(e); });
    inc.removed.forEach(r => { if (!out.removed.some(x => x.workout.id === r.workout.id && x.removedAt === r.removedAt)) out.removed.push(r); });
    return { out, summary: `Added ${added + copies} saved workout${added + copies === 1 ? "" : "s"}${copies ? ` (${copies} as copies)` : ""} and ${newLogs} history entr${newLogs === 1 ? "y" : "ies"}.` };
  }
  // Write every slot or none: snapshot what's there, write, and put the snapshot back if any write fails.
  function writeAll(slots) {
    const before = {};
    Object.keys(slots).forEach(k => { before[k] = localStorage.getItem(k); });
    for (const [k, v] of Object.entries(slots)) {
      if (!writeRaw(k, v)) {
        Object.entries(before).forEach(([bk, bv]) => { try { bv == null ? localStorage.removeItem(bk) : localStorage.setItem(bk, bv); } catch {} });
        return false;
      }
    }
    return true;
  }
  function slotsFor(s) {
    return {
      [LOCAL_SAVED]: JSON.stringify({ dataVersion: DATA_VERSION, workouts: s.days, updatedAt: Date.now() }),
      [LOCAL_FAVS]: JSON.stringify(s.favs), [LOCAL_LOGS]: JSON.stringify(s.logs),

  }
  function applyState(s) {

  }
  function importSheet() {
    openSheet(`
      <h2>Import <em>backup</em></h2>

      <label class="btn primary filebtn">Choose backup file<input type="file" id="f-file" accept=".json,application/json,text/plain"></label>
      <div class="field"><label for="f-paste">Or paste backup text</label><textarea id="f-paste" rows="4" spellcheck="false" class="mono"></textarea></div>
      <button class="btn" id="b-paste">Use pasted text</button>
      <div class="err" id="err"></div>
      <div id="imp-choice"></div>
      <div class="btns"><button class="btn ghost" id="b-cancel">Cancel</button></div>`, root => {
      const err = $("#err", root), box = $("#imp-choice", root);
      const handle = text => {
        err.textContent = ""; box.innerHTML = "";
        const { data, error } = parseBackup(text);

        box.innerHTML = `<div class="panel inset">

            const out = { days: data.saved, favs: data.favorites, logs: data.logs, customEx: data.exercises, removed: data.removed };
            if (!writeAll(slotsFor(out))) return err.textContent = "Couldn't save the import (phone storage may be full). Nothing was changed.";
            applyState(out); closeSheet(); toast("Backup restored");
          });

      $("#f-file", root).addEventListener("change", e => {
        const f = e.target.files?.[0]; if (!f) return;

      });
      $("#b-paste", root).onclick = () => { const t = $("#f-paste", root).value; if (!t.trim()) return err.textContent = "Paste your backup text first."; handle(t); };
      $("#b-cancel", root).onclick = closeSheet;
    });
  }

  /* ---------- share a saved workout as a link ---------- */
  const b64u = bytes => { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const unb64u = str => { const s = atob(str.replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, c => c.charCodeAt(0)); };
  async function encodeWorkout(w) {
    const payload = { v: 1, n: w.name, e: w.exercises.map(e => [e.name, e.sets.map(s => [s.r ?? null, s.w ?? null, s.pair ? 1 : 0])]) };
    const json = new TextEncoder().encode(JSON.stringify(payload));
    if (window.CompressionStream) {
      try { const cs = new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw")); return "z" + b64u(new Uint8Array(await new Response(cs).arrayBuffer())); } catch {}
    }
    return "j" + b64u(json);
  }
  async function decodeWorkout(code) {
    if (!code || !/^[zj][A-Za-z0-9_-]+$/.test(code)) throw new Error("bad");
    let bytes = unb64u(code.slice(1));
    if (code[0] === "z") {
      if (!window.DecompressionStream) throw new Error("old");
      const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      bytes = new Uint8Array(await new Response(ds).arrayBuffer());
    }
    const p = JSON.parse(new TextDecoder().decode(bytes));
    if (!p || p.v !== 1 || typeof p.n !== "string" || !Array.isArray(p.e) || !p.e.length) throw new Error("bad");
    const num = v => v === "BW" ? "BW" : typeof v === "number" && isFinite(v) && v >= 0 && v < 10000 ? v : null;
    return {
      name: p.n.trim().slice(0, 40) || "Shared workout",
      exercises: p.e.slice(0, 60).map(x => {
        if (!Array.isArray(x) || typeof x[0] !== "string" || !Array.isArray(x[1])) throw new Error("bad");
        return { id: uid(), name: x[0].slice(0, 60), sets: x[1].slice(0, MAX_SETS).map(s => ({ r: num(s?.[0]), w: num(s?.[1]), pair: !!s?.[2] })) };
      })
    };
  }
  async function shareSaved() {
    const w = curDay(); if (!w || w === adhoc) return;
    if (!settings.name) return askNameThenShare();
    const url = `${location.origin}${location.pathname}#w=${await encodeWorkout(w)}`;
    const text = `${settings.name} shared ${w.name} with you.`;
    if (navigator.share) {
      try { await navigator.share({ title: w.name, text, url }); return; }
      catch (e) { if (e?.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(`${text} ${url}`); toast("Link copied. Paste it in a message."); }
    catch { copyTextSheet("Share link", `${text} ${url}`); }
  }
  function askNameThenShare() {
    openSheet(`
      <h2>Your <em>name</em></h2>

  function copyTextSheet(title, text) {
    openSheet(`
      <h2>${esc(title)}</h2>
      <div class="field"><textarea id="f-t" rows="4" class="mono" readonly></textarea></div>

      <div class="btns"><button class="btn ghost" id="b-cancel">Close</button></div>`, root => {

  async function importShared(code) {
    let w;
    try { w = await decodeWorkout(code); }
    catch (e) {
      return toast(e?.message === "old" ? "This phone's browser is too old to open shared workouts. Update iOS or Chrome, then try again." : "That shared workout link is broken or incomplete. Ask for it to be shared again.");
    }
    w.id = uid(); w.name = uniqueName(w.name); w.savedAt = new Date().toISOString();
    state.days.push(w); save();                       // new, editable, not a Favorite
    openSaved(state.days.length - 1); toast("Workout imported");
  }
  const linkCode = text => (String(text).match(/#w=([zj][A-Za-z0-9_-]+)/) || [])[1] || null;
  function importLinkSheet() {
    openSheet(`
      <h2>Import a <em>shared workout</em></h2>
      <p class="pnote">Paste the link someone shared with you.</p>
      <div class="field"><label for="f-link">Shared link</label><textarea id="f-link" rows="3" spellcheck="false" class="mono"></textarea></div>
      <div class="err" id="err"></div>
      <div class="btns"><button class="btn primary" id="b-go">Import workout</button><button class="btn ghost" id="b-cancel">Cancel</button></div>`, root => {
      $("#b-go", root).onclick = () => {
        const code = linkCode($("#f-link", root).value);
        if (!code) return $("#err", root).textContent = "That doesn't look like a Workout Split link. Paste the whole link.";
        closeSheet(); setTimeout(() => importShared(code), 250);
      };
      $("#b-cancel", root).onclick = closeSheet;
    });
  }
  // Opened from a shared link (…/#w=…). On iPhone, links open in Safari, whose data is separate from the
  // Home Screen app, so offer to copy the link for pasting into the app instead.
  function handleShareLink() {
    const code = linkCode(location.hash);
    if (!location.hash.startsWith("#w=")) return;
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
    if (!code) return toast("That shared workout link is broken or incomplete. Ask for it to be shared again.");
    if (isIOS() && !isStandalone()) {
      const link = `${location.origin}${location.pathname}#w=${code}`;
      return openSheet(`
        <h2>Someone shared a <em>workout</em></h2>
        <p class="pnote">If you use Workout Split from your Home Screen, its data is separate from Safari. Copy the link, open the app from your Home Screen, then go to Settings → Import a shared workout link.</p>
        <div class="btns">
          <button class="btn primary" id="b-copy">Copy link for my Home Screen app</button>
          <button class="btn" id="b-here">Import here in Safari</button>
          <button class="btn ghost" id="b-cancel">Cancel</button>
        </div>`, root => {
        $("#b-copy", root).onclick = async () => {
          try { await navigator.clipboard.writeText(link); closeSheet(); toast("Link copied. Open the app from your Home Screen."); }
          catch { closeSheet(); setTimeout(() => copyTextSheet("Shared workout link", link), 250); }
        };
        $("#b-here", root).onclick = () => { closeSheet(); setTimeout(() => importShared(code), 250); };
        $("#b-cancel", root).onclick = closeSheet;
      });
    }
    importShared(code);
  }

  /* ---------- events ---------- */
  const go = v => { ddOpen = false; view = v; render(); window.scrollTo({ top: 0 }); };
  document.getElementById("app").addEventListener("click", e => {
    const t = e.target.closest("[data-view],[data-act]"); if (!t) return;
    if (t.dataset.view != null) return go(t.dataset.view === "home" || t.dataset.view === "settings" ? t.dataset.view : +t.dataset.view);
    const act = t.dataset.act;
    if (act !== "toggle-saved" && ddOpen) { ddOpen = false; renderTopbar(); }
    if (act === "toggle-saved") { ddOpen = !ddOpen; renderTopbar(); }
    else if (act === "open-saved") openSaved(+t.dataset.i);
    else if (act === "new-saved") newSavedSheet();
    else if (act === "start") go(detailIdx);
    else if (act === "back-detail") openSaved(view);
    else if (act === "fav") toggleFav();
    else if (act === "share") shareSaved();
    else if (act === "remove-saved") removeSavedSheet();
    else if (act === "edit-day") renameSheet();
    else if (act === "finish-adhoc") finishAdhoc();
    else if (act === "save-adhoc") saveAsSheet(adhoc?.exercises || [], adhoc?.name === "Ad Hoc" ? "My workout" : adhoc?.name);
    else if (act === "keep-adhoc") toggleKeep();
    else if (act === "delete-adhoc") deleteAdhocSheet();
    else if (act === "cal-prev") { calMonth = shiftMonth(calMonth || thisMonth(), -1); render(); }
    else if (act === "cal-next") { calMonth = shiftMonth(calMonth || thisMonth(), 1); render(); }
    else if (act === "cal-day") calDaySheet(t.dataset.date);
    else if (act === "add-ex") exSheet(null);
    else if (act === "edit-ex") exSheet(+t.dataset.ex);
    else if (act === "edit-set") setSheet(+t.dataset.ex, +t.dataset.set);
    else if (act === "complete") toggleComplete(+t.dataset.ex);
    else if (act === "pick-day") pickDaySheet();
    else if (act === "go-day") go(+t.dataset.day);
    else if (act === "log") logSheet(t.dataset.type);
    else if (act === "view-log") viewLog(t.dataset.id);
    else if (act === "export") exportData();
    else if (act === "import") importSheet();
    else if (act === "import-link") importLinkSheet();
    else if (act === "restore-removed") restoreRemoved(+t.dataset.i);
    else if (act === "check-update") checkForUpdate(true);
    else if (act === "dismiss-tip") { settings.tipDismissed = true; persistSettings(); render(); }
  });
  // Close the Saved Workouts dropdown when tapping anywhere else.
  document.addEventListener("click", e => { if (ddOpen && !e.target.closest(".dd")) { ddOpen = false; renderTopbar(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && ddOpen) { ddOpen = false; renderTopbar(); } });
  // Settings fields save as you type.
  document.getElementById("app").addEventListener("input", e => {
    const k = e.target.dataset?.setting; if (!k) return;
    settings[k] = e.target.value.trim(); persistSettings();
  });

  /* ---------- drag to reorder exercises ---------- */
  function moveExercise(from, to) {
    const a = curDay().exercises;
    if (to === from || to < 0 || to >= a.length) return;
    const [x] = a.splice(from, 1); a.splice(to, 0, x); commit();
  }
  document.addEventListener("pointerdown", e => {
    const h = e.target.closest("[data-handle]"); if (!h || !curDay()) return;
    e.preventDefault();
    const cards = [...document.querySelectorAll(".list .card")];
    const from = +h.dataset.handle, card = cards[from];
    const rects = cards.map(c => c.getBoundingClientRect());
    const gap = cards.length > 1 ? rects[1].top - rects[0].bottom : 12;
    const shiftBy = rects[from].height + gap;
    dragging = { from, to: from, startY: e.clientY, cards, rects, shiftBy, card, id: e.pointerId };
    try { h.setPointerCapture(e.pointerId); } catch {}
    card.classList.add("dragging"); document.body.classList.add("drag-lock");
    cards.forEach((c, i) => { if (i !== from) c.classList.add("shifting"); });
  });
  document.addEventListener("pointermove", e => {
    const d = dragging; if (!d || e.pointerId !== d.id) return;
    const dy = e.clientY - d.startY;
    d.card.style.transform = `translateY(${dy}px)`;
    const mid = d.rects[d.from].top + d.rects[d.from].height / 2 + dy;
    let to = d.from;
    d.rects.forEach((r, i) => {
      const m = r.top + r.height / 2;
      if (i > d.from && mid > m) to = Math.max(to, i);
      if (i < d.from && mid < m) to = Math.min(to, i);
    });
    d.to = to;
    d.cards.forEach((c, i) => {
      if (i === d.from) return;
      let s = 0;
      if (d.from < to && i > d.from && i <= to) s = -d.shiftBy;
      if (d.from > to && i < d.from && i >= to) s = d.shiftBy;
      c.style.transform = s ? `translateY(${s}px)` : "";
    });
  });
  function endDrag(e) {
    const d = dragging; if (!d || (e && e.pointerId !== d.id)) return;
    dragging = null;
    document.body.classList.remove("drag-lock");
    d.cards.forEach(c => { c.style.transform = ""; c.classList.remove("dragging", "shifting"); });
    if (d.to !== d.from) moveExercise(d.from, d.to); else render();
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
  document.addEventListener("keydown", e => {
    const h = e.target.closest?.("[data-handle]"); if (!h) return;
    const i = +h.dataset.handle;
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      const to = i + (e.key === "ArrowUp" ? -1 : 1);
      moveExercise(i, to);
      document.querySelector(`[data-handle="${Math.max(0, Math.min(to, curDay().exercises.length - 1))}"]`)?.focus();
    }
  });

  /* ---------- iPhone keyboard: keep bottom sheets above it ---------- */
  // iOS doesn't shrink the page when the keyboard opens, so lift the sheet by the keyboard's height
  // and scroll the focused field into view.
  if (window.visualViewport) {
    const vv = window.visualViewport, sheet = $("#sheet");
    const fit = () => {
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      sheet.style.bottom = kb > 60 ? kb + "px" : "";
      sheet.style.maxHeight = kb > 60 ? Math.round(vv.height * 0.94) + "px" : "";
    };
    vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit);
  }
  document.addEventListener("focusin", e => {
    if (e.target.matches?.("input:not([type=checkbox]):not([type=file]),textarea") && e.target.closest("#sheet"))
      setTimeout(() => e.target.scrollIntoView({ block: "center", behavior: "smooth" }), 320);
  });

  /* ---------- updates: offer a refresh when a new version is ready ---------- */
  let swReg = null, waitingSW = null;
  function offerUpdate(worker) {
    if (!worker || !navigator.serviceWorker.controller) return;
    waitingSW = worker;
    const bar = $("#updbar"); bar.hidden = false;
  }
  $("#upd-go").onclick = () => {
    save();
    if (waitingSW) waitingSW.postMessage("skip-waiting"); else location.reload();
  };
  $("#upd-x").onclick = () => { $("#updbar").hidden = true; };
  async function checkForUpdate(manual) {
    if (!swReg) return manual && toast("Updates aren't available in this browser.");
    try { await swReg.update(); } catch {}
    if (swReg.waiting) return offerUpdate(swReg.waiting);
    if (manual) setTimeout(() => { if (!swReg.waiting && !swReg.installing) toast("You're on the latest version."); }, 1200);
  }

  boot();

  // Offline support and "Install app": register the service worker (needs https or localhost).
  if ("serviceWorker" in navigator) {
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloading) return; reloading = true; location.reload(); });
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
      swReg = reg;
      if (reg.waiting) offerUpdate(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        nw?.addEventListener("statechange", () => { if (nw.state === "installed") offerUpdate(nw); });
      });
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {}));
  }
})();
</script>
</body>
</html>
